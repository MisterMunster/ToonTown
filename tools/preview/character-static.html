<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Character preview (static)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      #info { position: fixed; left: 8px; top: 6px; font: 12px/1.3 ui-monospace, monospace; color: #1d2b3a; background: rgba(255,255,255,.6); padding: 4px 6px; border-radius: 6px; }
    </style>
    <!-- Fallback for when the Vite dev server is unavailable: serve the project
         with any static server and open this page instead of character.html. -->
    <script type="importmap">{ "imports": { "@babylonjs/core": "/node_modules/@babylonjs/core/index.js" } }</script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="info"></div>
    <!--
      Query params:
        preset=hero|random  seed=N  lod=high|low  outline=0|1
        state=idle|walk|run|jump|doubleJump|fall|land|wave   speed=m/s
        t=seconds (animation time simulated, then frozen; omit for live)
        seq=jump:0.25,doubleJump:0.2   (state:duration steps, then frozen)
        cam=front|tq|side|back|face|top|low    y=root height    look=x,y,z
        lineup=1  (hero + 8 random townsfolk side by side)
    -->
    <script type="module" src="./character.js"></script>
  </body>
</html>
