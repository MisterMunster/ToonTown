# Production override: put Caddy (automatic HTTPS) in front of the game.
# Used together with the base file, from the project root on the server:
#
#   docker compose -f docker-compose.yml -f deploy/compose.prod.yml up -d --build
#
# (deploy/deploy.sh does exactly this and checks the settings below first.)
#
# Required in .env (next to docker-compose.yml):
#   GAME_PASSWORD='...'         the password friends type (single quotes if it has $ or #)
#   SESSION_SECRET=...          openssl rand -hex 32
#   SITE_DOMAIN=game.example.com   DNS A record must point at this server
#   PUBLISH=127.0.0.1:8080      REQUIRED: keep the plain-HTTP app port off the
#                               internet (Docker-published ports bypass ufw!)
name: toon-town

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      toon-town:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates - keep this volume!
      - caddy_config:/config
    # Caddy only writes to /data and /config (the volumes above).
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # ports 80/443
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
