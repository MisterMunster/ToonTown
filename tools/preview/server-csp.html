<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toon Town - server CSP probe</title>
    <!--
      Exercises the Babylon.js features the game relies on (shaders, shadows,
      post-processing, glow, particles, sky material, dynamic/raw/data:/blob:
      textures, bundled web fonts, WebAudio) so the production server's
      Content-Security-Policy can be checked in a real browser. Build it with
      the production server in front (see notesForIntegrator) - under Vite's
      dev server there is no CSP. Any violation is logged with console.error.
    -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; font-family: Fredoka, system-ui, sans-serif; }
      canvas { width: 100%; height: 100%; display: block; }
      #report { position: fixed; left: 12px; top: 12px; padding: 8px 12px; border-radius: 12px;
        background: rgba(255, 250, 240, 0.92); color: #1d2b3a; font: 600 15px/1.35 Fredoka, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="report">CSP probe running...</div>
    <script type="module" src="./server-csp.js"></script>
  </body>
</html>
