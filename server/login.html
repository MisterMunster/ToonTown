<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#4cb8ff">
<title>Toon Town · Invite only</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!--
  Toon Town login page. Served by server/server.js, which fills in the
  double-brace placeholders (state, next, message). Fully self-contained:
  inline CSS + inline SVG only, no scripts, fonts or images from anywhere
  else (the CSP forbids them anyway).
-->
<style>
  :root {
    --ink: #1d2b3a;
    --ink-soft: #4a5a6c;
    --cream: #fffaf0;
    --sun: #ffb703;
    --sun-dark: #fb8500;
    --sky-top: #3eaef9;
    --sky: #8fd3ff;
    --sky-low: #dff4ff;
    --grass: #7ccf5b;
    --error: #e0435a;
    --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", "Varela Round",
      "Quicksand", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { height: 100%; -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px clamp(120px, 24vh, 220px);
    font-family: var(--font);
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky) 52%, var(--sky-low) 100%);
    background-color: var(--sky);
    overflow-x: hidden;
    position: relative;
  }

  /* ---------- backdrop: sun, clouds, little town on the hills ---------- */
  .scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .sun {
    position: absolute;
    top: clamp(24px, 7vh, 72px);
    right: clamp(20px, 9vw, 140px);
    width: clamp(70px, 11vw, 120px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 36%, #fff8d2 0%, #ffe066 45%, #ffbe2e 100%);
    box-shadow:
      0 0 0 14px rgba(255, 224, 102, 0.28),
      0 0 0 32px rgba(255, 224, 102, 0.14),
      0 0 90px 30px rgba(255, 210, 80, 0.35);
    animation: glow 5s ease-in-out infinite alternate;
  }

  .cloud {
    position: absolute;
    left: 0;
    width: 170px;
    height: 52px;
    border-radius: 52px;
    background: #fff;
    filter: drop-shadow(0 7px 0 rgba(122, 190, 240, 0.45));
    animation: drift var(--dur, 80s) linear infinite;
    animation-delay: var(--delay, 0s);
  }
  .cloud::before,
  .cloud::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: #fff;
  }
  .cloud::before { width: 80px; height: 80px; left: 24px; bottom: 16px; }
  .cloud::after { width: 60px; height: 60px; right: 26px; bottom: 14px; }
  .cloud.c1 { top: 9%;  scale: 1;    --dur: 95s;  --delay: -20s; }
  .cloud.c2 { top: 22%; scale: 0.7;  --dur: 120s; --delay: -75s; opacity: 0.9; }
  .cloud.c3 { top: 5%;  scale: 0.55; --dur: 140s; --delay: -105s; opacity: 0.85; }
  .cloud.c4 { top: 34%; scale: 0.85; --dur: 105s; --delay: -50s; }

  .town {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: clamp(150px, 30vh, 270px);
    display: block;
  }

  /* ---------- the card ---------- */
  main {
    position: relative;
    z-index: 1;
    width: min(100%, 410px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    margin: 0 0 6px;
    font-size: clamp(46px, 13vw, 86px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0.02em;
    text-align: center;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    column-gap: 0.32em;
    row-gap: 0.08em;
    user-select: none;
  }
  .logo .word { white-space: nowrap; }
  .logo .l {
    display: inline-block;
    color: var(--c);
    text-shadow:
      -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink), 3px 3px 0 var(--ink),
      0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink),
      0 9px 0 var(--ink);
    transform: rotate(var(--r, 0deg));
    animation: bob 2.8s ease-in-out infinite;
    animation-delay: var(--d, 0s);
  }
  .l:nth-child(1) { --c: #ff5d5d; --r: -6deg; --d: 0s; }
  .l:nth-child(2) { --c: #ffd93d; --r: 4deg;  --d: -0.2s; }
  .l:nth-child(3) { --c: #6bcb77; --r: -3deg; --d: -0.4s; }
  .l:nth-child(4) { --c: #4d96ff; --r: 6deg;  --d: -0.6s; }
  .word + .word .l:nth-child(1) { --c: #c77dff; --r: -5deg; --d: -0.8s; }
  .word + .word .l:nth-child(2) { --c: #ff8c42; --r: 3deg;  --d: -1s; }
  .word + .word .l:nth-child(3) { --c: #00b4d8; --r: -4deg; --d: -1.2s; }
  .word + .word .l:nth-child(4) { --c: #ff6b9d; --r: 5deg;  --d: -1.4s; }

  .sign {
    margin: 8px 0 22px;
    padding: 6px 14px 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.85);
    box-shadow: 0 3px 0 rgba(29, 43, 58, 0.18);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .card {
    position: relative;
    width: 100%;
    padding: 46px 28px 26px;
    border-radius: 30px;
    background: var(--cream);
    border: 3px solid var(--ink);
    box-shadow: 0 9px 0 var(--ink), 0 24px 50px rgba(17, 60, 105, 0.28);
    text-align: center;
  }

  .badge {
    position: absolute;
    top: -34px;
    left: 50%;
    width: 68px;
    height: 68px;
    margin-left: -34px;
    border-radius: 50%;
    background: var(--sun);
    border: 3px solid var(--ink);
    box-shadow: 0 5px 0 var(--ink);
    display: grid;
    place-items: center;
  }
  .badge svg { width: 40px; height: 40px; display: block; }

  h2 {
    margin: 0 0 8px;
    font-size: clamp(22px, 6vw, 27px);
    font-weight: 900;
    line-height: 1.15;
  }

  .lead {
    margin: 0 0 20px;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink-soft);
  }

  form { display: grid; gap: 14px; margin: 0; }

  .field { position: relative; }
  .field svg {
    position: absolute;
    left: 16px;
    top: 50%;
    width: 24px;
    height: 24px;
    margin-top: -12px;
    pointer-events: none;
  }

  input[type="password"] {
    width: 100%;
    height: 58px;
    padding: 0 18px 0 52px;
    border-radius: 18px;
    border: 3px solid #c9dbea;
    background: #fff;
    color: var(--ink);
    font: 700 18px/1 var(--font);
    outline: none;
    box-shadow: inset 0 3px 0 rgba(29, 43, 58, 0.06);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="password"]::placeholder { color: #8fa3b6; font-weight: 600; }
  input[type="password"]:focus {
    border-color: var(--sun);
    box-shadow: 0 0 0 5px rgba(255, 183, 3, 0.28), inset 0 3px 0 rgba(29, 43, 58, 0.06);
  }

  button {
    height: 60px;
    border: 3px solid var(--ink);
    border-radius: 18px;
    background: linear-gradient(180deg, #ffc93a 0%, var(--sun) 100%);
    color: var(--ink);
    font: 900 21px/1 var(--font);
    letter-spacing: 0.01em;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--sun-dark), 0 6px 0 3px var(--ink);
    transform: translateY(0);
    transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
    -webkit-tap-highlight-color: transparent;
    margin-bottom: 9px;
  }
  button:hover { filter: brightness(1.05) saturate(1.1); }
  button:focus-visible { outline: 4px solid #4d96ff; outline-offset: 5px; }
  button:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 var(--sun-dark), 0 1px 0 3px var(--ink);
  }

  .msg {
    margin: 0;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.35;
  }
  .msg--error { background: #ffe3e7; color: #b3243b; }
  .msg--info { background: #e2f6d9; color: #2f6b1d; }

  .is-error input[type="password"] { border-color: var(--error); }
  .is-error .card { animation: shake 0.45s ease-in-out 1; }

  .hint {
    margin: 16px 0 0;
    font-size: 13px;
    line-height: 1.4;
    color: #7a8a9b;
  }

  footer {
    margin-top: 24px;
    padding: 5px 12px 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.72);
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    text-align: center;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  @keyframes drift {
    from { transform: translateX(-260px); }
    to { transform: translateX(calc(100vw + 260px)); }
  }
  @keyframes bob {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -5px; }
  }
  @keyframes glow {
    from { scale: 1; }
    to { scale: 1.06; }
  }
  @keyframes shake {
    0%, 100% { translate: 0 0; }
    20% { translate: -10px 0; }
    40% { translate: 9px 0; }
    60% { translate: -6px 0; }
    80% { translate: 4px 0; }
  }

  @media (max-width: 420px) {
    .card { padding: 44px 20px 22px; border-radius: 26px; }
    .sign { margin-bottom: 20px; }
  }

  @media (max-width: 360px) {
    .sign { font-size: 11px; letter-spacing: 0.05em; white-space: nowrap; }
  }

  /* Phones held sideways: keep the password box and button above the fold. */
  @media (max-height: 560px) and (orientation: landscape) {
    body { padding-top: 12px; padding-bottom: 12px; }
    .logo { font-size: 38px; margin-bottom: 30px; }
    .sign, .hint, footer { display: none; }
    .card { padding: 40px 24px 18px; }
    .lead { margin-bottom: 14px; }
    .town { height: 100px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

          <circle cx="90" cy="196" r="6" fill="#ff6b9d"/>

  <main>
    <h1 class="logo" aria-label="Toon Town">
      <span class="word" aria-hidden="true"><span class="l">T</span><span class="l">O</span><span class="l">O</span><span class="l">N</span></span>
      <span class="word" aria-hidden="true"><span class="l">T</span><span class="l">O</span><span class="l">W</span><span class="l">N</span></span>
    </h1>
    <p class="sign">Population: you &amp; your friends</p>

    <section class="card" aria-labelledby="title">
      <div class="badge" aria-hidden="true">
        <!-- envelope with a heart seal: "you're invited" -->
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#1d2b3a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
            <rect x="5" y="10" width="30" height="21" rx="4" fill="#fffaf0"/>
            <path d="M6 12 L20 23 L34 12" fill="none"/>
          </g>
          <path d="M20 27.5 C14.5 23.6 15.4 19.4 18.2 19.2 C19.1 19.1 19.7 19.6 20 20.3 C20.3 19.6 20.9 19.1 21.8 19.2 C24.6 19.4 25.5 23.6 20 27.5 Z" fill="#ff5d5d" stroke="#1d2b3a" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </div>

      <h2 id="title">This town is invite-only</h2>
      <p class="lead">Got the secret password? Pop it in below and come on in!</p>

      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{next}}">
        <!-- lets password managers remember the password for this site -->
        <input type="text" name="username" value="guest" autocomplete="username" hidden>
        <label class="sr-only" for="password">Password</label>
        <div class="field">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g fill="none" stroke="#fb8500" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="12" r="4.2" fill="#ffd93d"/>
              <path d="M12.2 12 H21 M17.5 12 V15.5 M20.5 12 V14.5"/>
            </g>
          </svg>
          <input id="password" name="password" type="password" placeholder="Secret password"
                 autocomplete="current-password" autocapitalize="off" spellcheck="false"
                 enterkeyhint="go" maxlength="256" required autofocus>
        </div>
        {{message}}
        <button type="submit">Let me in!</button>
      </form>

      <p class="hint">Psst&hellip; the friend who sent you the link knows the password.</p>
    </section>

    <footer>A tiny 3D town, hand-built with Babylon.js</footer>
  </main>
</body>
</html>
